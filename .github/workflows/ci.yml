name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Node.js instellen
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Dependencies installeren
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Patroon-check
        # Controleert op verboden codepatronen die eerder tot productiefouten
        # hebben geleid (JAVASCRIPT-REACT-6, kritiek-1/2/3).
        # Blokkerende patronen: localStorage.getItem(DEVICE_ID_KEY) buiten useDeviceId.js
        # Waarschuwende patronen: .single() buiten INSERT-context, payload.new zonder guard
        # Voeg nieuwe patronen toe in scripts/controleer-patronen.js.
        run: npm run lint:patronen

      - name: Vulnerability scan
        run: npm audit --audit-level=high

      - name: Tests draaien
        run: npm run test:run

  e2e:
    name: E2e tests (Chromium)
    needs: test
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Node.js instellen
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Dependencies installeren
        run: npm ci

      - name: Playwright browser-versie ophalen
        id: pw-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Playwright Chromium cache laden
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.pw-version.outputs.version }}-${{ runner.os }}

      - name: Playwright Chromium installeren (alleen bij cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Playwright system-deps installeren (altijd — libraries kunnen ontbreken)
        run: npx playwright install-deps chromium

      - name: E2e tests draaien
        run: npx playwright test --project=chromium

      - name: Playwright HTML-rapport uploaden bij falen
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-rapport
          path: playwright-report/
          retention-days: 14

  deploy:
    name: Deploy naar Cloudflare Pages
    needs: [test, e2e]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Node.js instellen
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Dependencies installeren
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      - name: Deploy naar Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd  # v3.14.1 — SEC-A9 SHA-pin
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=digipot --branch=main
