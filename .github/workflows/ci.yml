name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Dependencies installeren
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Patroon-check
        # Controleert op verboden codepatronen die eerder tot productiefouten
        # hebben geleid (JAVASCRIPT-REACT-6, kritiek-1/2/3).
        # Blokkerende patronen: localStorage.getItem(DEVICE_ID_KEY) buiten useDeviceId.js
        # Waarschuwende patronen: .single() buiten INSERT-context, payload.new zonder guard
        # Voeg nieuwe patronen toe in scripts/controleer-patronen.js.
        run: npm run lint:patronen

      - name: Vulnerability scan
        run: npm audit --audit-level=high

      - name: Tests draaien
        run: npm run test:run

  deploy:
    name: Deploy naar Cloudflare Pages
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Dependencies installeren
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      - name: Deploy naar Cloudflare Pages
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65  # v3.14.1 — SEC-A9 SHA-pin
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=digipot --branch=main
