name: Dagelijkse health check

on:
  schedule:
    # Elke dag om 08:00 UTC (09:00 NL zomertijd)
    - cron: '0 8 * * *'
  workflow_dispatch: # handmatig triggeren mogelijk

jobs:
  health:
    name: Supabase + app bereikbaarheid
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Supabase REST bereikbaarheid
        # Verifieert: Supabase reageert, anon key is geldig, tabel bestaat
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/potjes?limit=1")

          echo "Supabase REST status: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "❌ Supabase REST niet bereikbaar (status $STATUS)"
            exit 1
          fi

          echo "✅ Supabase REST bereikbaar"

      - name: App bereikbaarheid
        # Verifieert: Cloudflare Pages serveert de app
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://digipot.pages.dev")

          echo "App status: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "❌ App niet bereikbaar (status $STATUS)"
            exit 1
          fi

          echo "✅ App bereikbaar"

      - name: Supabase schrijf + lees (mini smoke test)
        # Maakt een testpotje aan en verwijdert het direct
        # Verifieert: INSERT en DELETE werken, RLS blokkeert niet onverwacht
        run: |
          node --input-type=module << 'EOF'
          const url = process.env.SUPABASE_URL
          const key = process.env.SUPABASE_KEY
          const headers = {
            'Content-Type': 'application/json',
            'apikey': key,
            'Authorization': `Bearer ${key}`,
            'Prefer': 'return=representation',
          }

          // INSERT
          const ins = await fetch(`${url}/rest/v1/potjes`, {
            method: 'POST',
            headers,
            body: JSON.stringify({ naam: '[HEALTH] dagelijkse check', status: 'open', valuta: 'EUR' }),
          })
          if (!ins.ok) {
            console.error('❌ INSERT mislukt:', ins.status, await ins.text())
            process.exit(1)
          }
          const [potje] = await ins.json()
          console.log(`✅ INSERT geslaagd: ${potje.id}`)

          // DELETE (opruimen)
          const del = await fetch(`${url}/rest/v1/potjes?id=eq.${potje.id}`, {
            method: 'DELETE',
            headers,
          })
          if (!del.ok) {
            console.error('❌ DELETE mislukt:', del.status, await del.text())
            process.exit(1)
          }
          console.log('✅ DELETE geslaagd — testdata opgeruimd')
          console.log('✅ Supabase schrijf + lees werkt correct')
          EOF
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Lifecycle Edge Functions bereikbaarheid
        # Verifieert dat de Edge Function URL reageert (niet dat hij draait)
        # Zonder cron-secret krijgen we een 401 — dat is correct gedrag
        # GET gebruiken want HEAD wordt niet ondersteund door Edge Functions (405)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET \
            "${{ secrets.VITE_SUPABASE_URL }}/functions/v1/lifecycle-keepalive")

          echo "Lifecycle Edge Function status: $STATUS"

          # 401 = bereikbaar maar niet geautoriseerd (correct — secret ontbreekt)
          # 200 = bereikbaar en reageert (ook correct)
          # 405 = method not allowed (endpoint bestaat maar accepteert HEAD niet)
          # Alles anders = probleem
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "401" ] && [ "$STATUS" != "405" ]; then
            echo "❌ Lifecycle Edge Function niet bereikbaar (status $STATUS)"
            exit 1
          fi

          echo "✅ Lifecycle Edge Function bereikbaar (status $STATUS)"
